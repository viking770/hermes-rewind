name: rewind
title: Rewind
repo: https://github.com/viking770/hermes-rewind
# Commit with the plugin code under rewind/. Bump it in the PR whenever rewind/ changes.
sha: bc19018d4e18e0c296bc84ed62a66d6b6875d2f8
subdir: rewind
version: "0.2.2"
description: Undo button for the agent's terminal. A Docker sandbox backend that snapshots before every file-changing command, keeps the history across idle shutdowns, and rolls back with /rewind undo.
maintainer: viking770
tier: community
category: tools
requires_hermes: ">=0.22.7"        # keep in sync with rewind/plugin.yaml
docs_url: https://github.com/viking770/hermes-rewind#readme
platforms: [macos, linux, windows]
capabilities:
  provides_tools: [rewind_undo, rewind_list, rewind_snapshot, rewind_restore, rewind_changes, rewind_export]
  provides_hooks: [pre_tool_call]
