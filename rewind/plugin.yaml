name: rewind
version: 0.1.0
description: Undoable Docker sandbox terminal backend. Every command that can change files is snapshotted first, so the agent (or you) can roll the sandbox back.
author: Vikram Singh
kind: backend
# TODO before submitting: install Hermes, run `hermes --version`, and set this
# to the oldest version you actually tested (catalog rule 14).
requires_hermes: ">=0.22"
provides_tools:
  - rewind_list
  - rewind_snapshot
  - rewind_restore
  - rewind_changes
