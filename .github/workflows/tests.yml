name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Hermes supports Python 3.11 to 3.14; Windows and macOS have code paths of their own.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # Standard library only: nothing to install.
      - name: Unit tests (no Docker)
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Docker integration tests
        env:
          REWIND_INTEGRATION: "1"
        run: python -m unittest tests.test_docker_integration -v
      - name: Stress test (attacks every protection)
        # Also writes the results table to this run's summary page.
        run: python scripts/stress_test.py --report stress-report
      - name: Keep the stress-test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: stress-report
          path: stress-report.*
          if-no-files-found: ignore
      - name: No sandboxes left behind
        if: always()
        run: |
          left=$(docker ps -aq --filter label=hermes.rewind=1)
          if [ -n "$left" ]; then docker ps -a --filter label=hermes.rewind=1; exit 1; fi
