name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Hermes supports Python 3.11 to 3.14; Windows and macOS have code paths of their own.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Standard library only: nothing to install.
      - name: Unit tests (no Docker)
        run: python -m unittest discover -s tests -t . -v

  docker:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docker integration tests
        env:
          REWIND_INTEGRATION: "1"
        run: python -m unittest tests.test_docker_integration -v
      - name: No sandboxes left behind
        if: always()
        run: |
          left=$(docker ps -aq --filter label=hermes.rewind=1)
          if [ -n "$left" ]; then docker ps -a --filter label=hermes.rewind=1; exit 1; fi
